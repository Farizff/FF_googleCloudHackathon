<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bounce v5 L1 prototype</title>
  <meta name="google-maps-api-key" content="__GOOGLE_MAPS_API_KEY__">
  <style>
    :root {
      --purple: #1A0A6B;
      --purple-mid: #4A2FC4;
      --purple-light: #6B50E8;
      --purple-tint: #EDE9FF;
      --lime: #C8E64A;
      --lime-dark: #8DC63F;
      --lime-tint: #F0FFD4;
      --lime-text: #3A5200;
      --orange: #F47B20;
      --orange-yellow: #FBBF24;
      --orange-tint: #FFF7ED;
      --success: #16A34A;
      --success-tint: #F0FDF4;
      --warning: #D97706;
      --warning-tint: #FFF7ED;
      --danger: #DC2626;
      --danger-tint: #FEF2F2;
      --danger-text: #7F1D1D;
      --cat-food: #F47B20;
      --cat-culture: #7C3AED;
      --cat-nature: #16A34A;
      --cat-transport: #1A0A6B;
      --cat-shopping: #EC4899;
      --cat-hotel: #C8E64A;
      --cat-nightlife: #4A2FC4;
      --cat-wellness: #0D9488;
      --bg-page: #FAF8FF;
      --bg-card: #FFFFFF;
      --bg-raised: #FAFAFA;
      --text-primary: #1A1A2E;
      --text-secondary: #5B5F6E;
      --text-tertiary: #9CA3AF;
      --text-inverse: #FFFFFF;
      --border-light: #ECE9F4;
      --border-medium: #D1CEDB;
      --border-strong: #9CA3AF;
      --font-logo: 'Baloo 2', system-ui, cursive;
      --font-display: 'Nunito', system-ui, sans-serif;
      --font-sans: 'Nunito', system-ui, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      --text-xs: 11px;
      --text-sm: 13px;
      --text-base: 15px;
      --text-md: 17px;
      --text-lg: 20px;
      --text-xl: 26px;
      --text-2xl: 34px;
      --text-3xl: 48px;
      --leading-tight: 1.2;
      --leading-normal: 1.5;
      --leading-relaxed: 1.65;
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;
      --sp-16: 64px;
      --r-xs: 6px;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --r-xl: 24px;
      --r-2xl: 30px;
      --r-pill: 99px;
      --shadow-card: 0 1px 3px rgba(26,10,107,.05), 0 0 0 .5px rgba(26,10,107,.04);
      --shadow-raised: 0 6px 20px rgba(26,10,107,.08);
      --shadow-float: 0 12px 36px rgba(26,10,107,.14);
      --shadow-bounce: 0 6px 28px rgba(26,10,107,.32);
      --z-nav: 100;
      --z-chat: 200;
      --z-overlay: 300;
      --z-toast: 400;
      --z-judge: 500;
      --t-fast: 140ms ease;
      --t-normal: 220ms ease;
      --t-slow: 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--font-sans); font-size: var(--text-base); background: var(--bg-page); color: var(--text-primary); }
    button, select { font: inherit; }
    .app-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: var(--purple); color: var(--text-inverse); padding: var(--sp-6) 18px; display: flex; flex-direction: column; gap: var(--sp-5); }
    .logomark { display: inline-flex; align-items: center; gap: var(--sp-2); font-family: var(--font-logo); font-weight: 900; font-size: var(--text-2xl); letter-spacing: -.03em; color: var(--text-inverse); text-decoration: none; }
    .logomark-o { color: var(--lime); text-shadow: 0 0 18px rgba(200,230,74,.35); }
    .bounce-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--purple); color: var(--lime); font-family: var(--font-logo); font-weight: 800; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--lime); }
    .bounce-avatar-sm { width: 28px; height: 28px; font-size: 14px; border-width: 1.5px; }
    .bounce-avatar-lg { width: 72px; height: 72px; font-size: 36px; box-shadow: var(--shadow-bounce); }
    .nav { display: grid; gap: var(--sp-2); }
    .nav button { text-align: left; background: transparent; color: rgba(255,255,255,.74); display: flex; align-items: center; gap: var(--sp-3); padding: 11px var(--sp-4); border-radius: var(--r-lg); border: 0; font-weight: 700; cursor: pointer; transition: var(--t-fast); }
    .nav button:hover { background: rgba(255,255,255,.08); color: var(--text-inverse); }
    .nav button.active { background: var(--lime); color: var(--purple); font-weight: 900; }
    .trip-card-context { border-left: 3px solid var(--lime); background: rgba(255,255,255,.06); border-radius: var(--r-md); padding: var(--sp-4); }
    .page-body { max-width: 1320px; margin: 0 auto; padding: var(--sp-8); }
    .hero { position: relative; overflow: hidden; background: var(--purple); color: var(--text-inverse); border-radius: var(--r-2xl); padding: var(--sp-8); display: grid; gap: var(--sp-3); box-shadow: var(--shadow-bounce); }
    .hero::after { content: ''; position: absolute; width: 220px; height: 220px; right: -72px; top: -72px; border-radius: 50%; background: var(--orange-tint); opacity: .22; }
    .hero h1 { position: relative; margin: 0; font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: -.02em; }
    .hero p { position: relative; margin: 0; color: rgba(255,255,255,.82); line-height: var(--leading-relaxed); }
    .btn { border: 0; border-radius: var(--r-pill); padding: 12px 22px; font-weight: 900; cursor: pointer; transition: var(--t-fast); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--purple-mid); color: var(--text-inverse); }
    .btn-primary:hover { background: var(--purple-light); }
    .btn-lime { background: var(--lime); color: var(--lime-text); }
    .btn-ghost { background: transparent; color: var(--purple); border: 1px solid var(--border-light); }
    .button-primary { background: var(--lime); color: var(--lime-text); border: 0; border-radius: var(--r-pill); padding: 12px 18px; font-weight: 900; cursor: pointer; }
    .home-plan-new { width: 100%; border: 0; text-align: left; border-radius: var(--r-2xl); padding: var(--sp-6); background: linear-gradient(135deg, var(--purple), var(--purple-mid)); color: var(--text-inverse); display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: var(--sp-4); box-shadow: var(--shadow-bounce); cursor: pointer; }
    .home-plan-new-icon { width: 56px; height: 56px; border-radius: var(--r-lg); background: var(--lime); color: var(--lime-text); display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-2xl); font-weight: 900; }
    .home-plan-new-body { display: grid; gap: var(--sp-1); }
    .home-plan-new-title { font-size: var(--text-xl); font-weight: 900; }
    .home-plan-new-sub { color: rgba(255,255,255,.82); line-height: var(--leading-normal); }
    .home-plan-new-arrow { font-size: var(--text-2xl); color: var(--lime); }
    .trips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); margin-top: var(--sp-4); }
    .trip-card { display: block; width: 100%; text-align: left; padding: 0; overflow: hidden; cursor: pointer; }
    .trip-cover { height: 180px; padding: var(--sp-4); background: var(--purple-tint); display: flex; align-items: flex-start; justify-content: flex-start; }
    .trip-state-badge { display: inline-flex; }
    .trip-meta { display: grid; gap: var(--sp-2); padding: var(--sp-5); }
    .trip-name { margin: 0; font-size: var(--text-md); font-weight: 900; color: var(--text-primary); }
    .avatar-stack { display: flex; align-items: center; margin-top: var(--sp-2); }
    .avatar-stack .member-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--purple); color: var(--lime); border: 2px solid var(--bg-card); display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: 900; margin-left: -6px; }
    .avatar-stack .member-avatar:first-child { margin-left: 0; }
    .card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--r-xl); padding: var(--sp-5); box-shadow: var(--shadow-card); }
    .card-purple { background: var(--purple); color: var(--text-inverse); border-color: var(--purple); }
    .card-lime { background: var(--lime-tint); border-color: var(--lime-dark); }
    .card-elevated { box-shadow: var(--shadow-raised); }
    .tag { display: inline-flex; border-radius: var(--r-pill); padding: 4px 10px; font-size: var(--text-xs); font-weight: 900; }
    .tag-lime { background: var(--lime-tint); color: var(--lime-text); border: 1px solid var(--lime-dark); }
    .tag-purple { background: var(--purple-tint); color: var(--purple-mid); }
    .tag-orange { background: var(--orange-tint); color: var(--warning); }
    .muted { color: var(--text-secondary); }
    .cut-note { border-style: dashed; background: var(--bg-card); }
    .bounce-fab { position: fixed; right: var(--sp-8); bottom: var(--sp-8); width: 64px; height: 64px; border-radius: 50%; background: var(--purple); color: var(--lime); border: 3px solid var(--lime); box-shadow: var(--shadow-bounce); z-index: var(--z-chat); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-logo); font-size: var(--text-2xl); font-weight: 900; cursor: pointer; }
    .bounce-fab.has-alert::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--lime); animation: pulse-ring 1.8s ease infinite; }
    @keyframes pulse-ring { 0% { transform: scale(.92); opacity: .8; } 70% { transform: scale(1.3); opacity: 0; } 100% { opacity: 0; } }
    .entry-conversation { display: grid; gap: var(--sp-5); }
    .entry-hero { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--sp-5); align-items: center; }
    .entry-mascot { width: 88px; height: 88px; border-radius: 50%; background: var(--purple); color: var(--lime); border: 3px solid var(--lime); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-logo); font-size: var(--text-3xl); font-weight: 900; box-shadow: var(--shadow-bounce); }
    .trip-prompt-textarea { width: 100%; min-height: 132px; resize: vertical; border: 1px solid var(--border-light); border-radius: var(--r-xl); padding: var(--sp-4); font: inherit; line-height: var(--leading-relaxed); }
    .trip-type-chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .trip-type-chip { border: 1px solid var(--border-light); background: var(--bg-card); color: var(--purple); border-radius: var(--r-pill); padding: 8px 12px; font-weight: 800; cursor: pointer; }
    .trip-type-chip.is-selected { background: var(--lime); color: var(--lime-text); border-color: var(--lime-dark); }
    .entry-response { border-left: 4px solid var(--lime-dark); background: var(--lime-tint); border-radius: 0 var(--r-lg) var(--r-lg) 0; padding: var(--sp-4) var(--sp-5); }

    .profile-layout { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
    .profile-tabs { display: grid; gap: var(--sp-2); position: sticky; top: var(--sp-5); }
    .profile-tab { width: 100%; text-align: left; border: 1px solid var(--border-light); background: var(--bg-card); color: var(--purple); border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4); font-weight: 900; cursor: pointer; }
    .profile-tab.active { background: var(--purple); color: var(--text-inverse); border-color: var(--purple); box-shadow: var(--shadow-raised); }
    .profile-tab-panel { min-height: 460px; display: flex; flex-direction: column; gap: var(--sp-4); }
    .profile-field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--sp-3); }
    .profile-field { border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: var(--sp-4); background: var(--bg-raised); }
    .profile-field strong { display: block; margin-bottom: var(--sp-1); color: var(--purple); }
    .profile-save-row { margin-top: auto; padding-top: var(--sp-4); border-top: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .profile-save-row.is-anchored { position: sticky; bottom: var(--sp-4); background: linear-gradient(180deg, rgba(255,255,255,.82), var(--bg-card)); border-radius: var(--r-lg); padding: var(--sp-3); box-shadow: var(--shadow-card); }
    .profile-feedback { color: var(--success); font-weight: 900; min-height: 22px; }
    .profile-readonly-note { border: 1px dashed var(--border-medium); border-radius: var(--r-lg); padding: var(--sp-3); color: var(--text-secondary); background: var(--bg-raised); }

    .planning-layout { display: grid; gap: var(--sp-5); }
    .planning-main-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: var(--sp-5); align-items: start; }
    .planning-day-rail { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .planning-day-rail button { border: 1px solid var(--border-light); background: var(--bg-card); color: var(--purple); border-radius: var(--r-pill); padding: 9px 13px; font-weight: 900; cursor: pointer; }
    .planning-day-rail button.active { background: var(--lime); color: var(--lime-text); border-color: var(--lime-dark); }
    .view-toggle { display: inline-flex; gap: var(--sp-1); padding: var(--sp-1); border-radius: var(--r-pill); background: var(--purple-tint); }
    .view-toggle button { border: 0; border-radius: var(--r-pill); padding: 8px 12px; background: transparent; color: var(--purple); font-weight: 900; cursor: pointer; }
    .view-toggle button.active { background: var(--purple); color: var(--text-inverse); }
    .activity-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-3); align-items: start; border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: var(--sp-4); background: var(--bg-card); }
    .activity-time { color: var(--purple); font-weight: 900; }
    .activity-menu { width: 34px; height: 34px; border: 1px solid var(--border-light); border-radius: 50%; background: var(--bg-card); color: var(--purple); font-weight: 900; cursor: pointer; }
    .budget-card { display: grid; gap: var(--sp-3); }
    .budget-input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    .budget-input-grid input { width: 100%; border: 1px solid var(--border-light); border-radius: var(--r-md); padding: var(--sp-3); font: inherit; }
    .budget-save-row { margin-top: auto; padding-top: var(--sp-3); border-top: 1px solid var(--border-light); display: flex; justify-content: space-between; gap: var(--sp-3); align-items: center; }
    .budget-save-row.is-anchored { position: sticky; bottom: var(--sp-4); background: var(--bg-card); border-radius: var(--r-lg); padding: var(--sp-3); box-shadow: var(--shadow-card); }
    .planning-map-card { min-height: 220px; display: grid; gap: var(--sp-3); background: linear-gradient(135deg, var(--purple-tint), var(--lime-tint)); }
    .google-map-canvas { min-height: 260px; width: 100%; border-radius: var(--r-lg); border: 1px solid rgba(26,10,107,.14); background: var(--purple-tint); overflow: hidden; }
    .map-fallback { display: grid; gap: var(--sp-2); place-items: center; min-height: 220px; border: 1px dashed var(--border-medium); border-radius: var(--r-lg); padding: var(--sp-4); text-align: center; background: rgba(255,255,255,.72); }
    .map-point-list { margin: 0; padding-left: 20px; color: var(--text-secondary); line-height: var(--leading-relaxed); }
    .flight-group { display: grid; gap: var(--sp-3); }
    .flight-option { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-3); border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: var(--sp-4); background: var(--bg-card); }
    .suggestions-list { display: grid; gap: var(--sp-3); }
    .suggestion-card { border-left: 4px solid var(--lime-dark); }
    .suggestions-nav-label { position: relative; display: inline-flex; align-items: center; gap: var(--sp-2); }
    .suggestions-nav-badge { position: absolute; right: -16px; top: -10px; min-width: 20px; height: 20px; border-radius: 50%; background: var(--lime); color: var(--lime-text); display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: 900; border: 1px solid var(--purple); }

    .active-today-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap: var(--sp-5); align-items: start; }
    .quick-action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-3); }
    .today-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-3); border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: var(--sp-4); background: var(--bg-card); }
    .flock-switcher { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .flock-switcher button { border: 1px solid var(--border-light); border-radius: var(--r-pill); background: var(--bg-card); color: var(--purple); padding: 9px 13px; font-weight: 900; cursor: pointer; }
    .flock-switcher button.active { background: var(--lime); color: var(--lime-text); border-color: var(--lime-dark); }
    .countdown-chip { display: inline-flex; border-radius: var(--r-pill); background: var(--orange-tint); color: var(--warning); padding: 6px 12px; font-weight: 900; }
    .flock-map-svg { width: 100%; min-height: 210px; border-radius: var(--r-lg); background: var(--purple-tint); }
    .modal-backdrop { position: fixed; inset: 0; z-index: var(--z-overlay); background: rgba(26,10,107,.38); display: grid; place-items: center; padding: var(--sp-5); }
    .disruption-modal { max-width: 720px; width: min(720px, 100%); display: grid; gap: var(--sp-3); }
    .expense-mode-grid, .expense-category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--sp-3); }
    .expense-mode-grid button, .expense-category-grid button { border: 1px solid var(--border-light); border-radius: var(--r-lg); background: var(--bg-card); color: var(--purple); padding: var(--sp-3); font-weight: 900; cursor: pointer; }
    .expense-mode-grid button.active, .expense-category-grid button.active { background: var(--purple); color: var(--text-inverse); }
    .alert-list { display: grid; gap: var(--sp-3); }
    .alert-card { border-left: 4px solid var(--orange); }

    .wrap-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--sp-3); }
    .wrap-category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--sp-3); }
    .wrap-category-card { border: 1px solid var(--border-light); border-radius: var(--r-lg); padding: var(--sp-4); background: var(--bg-raised); }
    .wrap-settlement-list { display: grid; gap: var(--sp-2); padding-left: 20px; }
    .bouncesay-card { border-left: 4px solid var(--lime-dark); background: var(--lime-tint); }

    .bounce-chat-panel { position: fixed; right: var(--sp-8); bottom: 112px; width: min(420px, calc(100vw - 32px)); max-height: min(680px, calc(100vh - 140px)); z-index: var(--z-chat); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
    .bounce-chat-header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); border-bottom: 1px solid var(--border-light); padding-bottom: var(--sp-3); }
    .bounce-message-stream { display: grid; align-content: start; gap: var(--sp-3); overflow: auto; padding: var(--sp-4) 0; }
    .bounce-message { border-radius: var(--r-lg); padding: var(--sp-3); background: var(--purple-tint); }
    .bounce-message.user { background: var(--lime-tint); justify-self: end; max-width: 88%; }
    .bounce-pill-input { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-2); border-top: 1px solid var(--border-light); padding-top: var(--sp-3); }
    .bounce-pill-input input { border: 1px solid var(--border-light); border-radius: var(--r-pill); padding: 12px 14px; font: inherit; }
    .permission-label { display: inline-flex; border-radius: var(--r-pill); padding: 6px 10px; background: var(--orange-tint); color: var(--warning); font-size: var(--text-xs); font-weight: 900; }
    .judge-panel { position: fixed; left: var(--sp-6); bottom: var(--sp-6); z-index: var(--z-judge); background: var(--purple); color: var(--text-inverse); border: 2px solid var(--lime); border-radius: var(--r-xl); padding: var(--sp-3); box-shadow: var(--shadow-float); min-width: 240px; user-select: none; touch-action: none; }
    .judge-panel-pill { width: 100%; border: 0; border-radius: var(--r-pill); background: var(--lime); color: var(--lime-text); padding: 10px 12px; font-weight: 900; cursor: grab; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
    .judge-panel-pill:active { cursor: grabbing; }
    .judge-panel-body { display: grid; gap: var(--sp-2); padding-top: var(--sp-3); }
    .judge-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }

    function renderEntryScreen() {
      const response = state.planningResponse || 'Organising everyone\'s ideas… Pick a few trip vibes, then tell Bounce what your group has in mind.';
      return renderShell(`<section class="entry-conversation"><div class="card entry-hero"><div class="entry-mascot" aria-hidden="true">B</div><div><span class="tag tag-lime">Plan a new trip</span><h1>Where should we bounce next?</h1><p class="muted">Your trip starts here. Tell me what you've got in mind.</p></div></div><div class="card"><label for="trip-prompt-textarea"><strong>Tell Bounce about the trip</strong></label><textarea id="trip-prompt-textarea" class="trip-prompt-textarea" placeholder="e.g. Five friends, Lisbon in July, food, music, not too much walking…">${state.entryPrompt}</textarea><p><strong>What kind of trip is this?</strong></p><div class="trip-type-chips">${TRIP_TYPE_CHIPS.map((chip) => `<button class="trip-type-chip ${state.selectedTripChips.includes(chip) ? 'is-selected' : ''}" onclick="toggleTripChip('${chip}')">${chip}</button>`).join('')}</div><div style="margin-top: var(--sp-4)"><button class="btn btn-primary" onclick="submitTripPrompt()">Ready to bounce →</button></div></div><div class="entry-response"><strong>Bounce</strong><p>${response}</p></div></section>`);
    }


    function renderProfileScreen() {
      const tab = PROFILE_TABS.find((item) => item.id === state.activeProfileTab) || PROFILE_TABS[0];
      const tabButtons = PROFILE_TABS.map((item) => `<button class="profile-tab ${tab.id === item.id ? 'active' : ''}" onclick="setProfileTab('${item.id}')" aria-selected="${tab.id === item.id}">${item.label}</button>`).join('');
      const fieldCards = tab.fields.map(([label, value]) => `<div class="profile-field"><strong>${label}</strong><span>${value}</span></div>`).join('');
      const saveRow = !tab.readOnly ? `<div class="profile-save-row is-anchored"><span class="profile-feedback" aria-live="polite">${state.profileFeedback}</span><button class="btn btn-lime" onclick="saveProfileTab('${tab.id}')">Save changes</button></div>` : `<div class="profile-readonly-note">Past trips tab is read-only and has no save button.</div>`;
      return renderShell(`<section class="card card-purple"><span class="tag tag-lime">Profile</span><h1>Fariz travel profile</h1><p>Tabbed profile data for the v5 L1 demo. Editable tabs keep their Save changes button anchored at the bottom.</p></section><section class="profile-layout"><aside class="profile-tabs" role="tablist" aria-label="Profile tabs">${tabButtons}</aside><article class="card profile-tab-panel" role="tabpanel"><span class="tag tag-purple">${tab.label}</span><h2>${tab.label}</h2><p class="muted">${tab.intro}</p><div class="profile-field-grid">${fieldCards}</div>${saveRow}</article></section>`);
    }


    function canEditPlanning() { return state.role !== 'member'; }
    function setPlanningDay(index) { state.activePlanningDay = index; renderApp(); }
    function setPlanningView(view) { state.planningView = view; renderApp(); }
    function saveBudgetDraft() { state.budgetFeedback = 'Budget saved for the demo'; renderApp(); }
    function getGoogleMapsApiKey() {
      const tag = document.querySelector('meta[name="google-maps-api-key"]');
      const key = tag ? tag.getAttribute('content').trim() : '';
      return key && key !== '__GOOGLE_MAPS_API_KEY__' ? key : '';
    }
    function mapFallbackCopy() { return 'Map unavailable — check Google Maps API key/restrictions.'; }
    function renderMapFallback(points) {
      return `<div class="map-fallback"><strong>${mapFallbackCopy()}</strong><span class="muted">Demo stops: ${points.map((point) => point.label).join(' → ')}</span></div>`;
    }
    function renderGoogleMapCard(id, title, points) {
      return `<aside class="card planning-map-card"><strong>${title}</strong><div id="${id}" class="google-map-canvas" role="application" aria-label="${title}">${renderMapFallback(points)}</div><ul class="map-point-list">${points.map((point) => `<li>${point.label}</li>`).join('')}</ul></aside>`;
    }
    function loadBounceGoogleMapsScript() {
      if (window.google?.maps) return Promise.resolve();
      const key = getGoogleMapsApiKey();
      if (!key) return Promise.reject(new Error('missing Google Maps API key'));
      if (window.__bounceMapsPromise) return window.__bounceMapsPromise;
      window.__bounceMapsPromise = new Promise((resolve, reject) => {
        window.initBounceMaps = () => resolve();
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=initBounceMaps&loading=async`;
        script.async = true;
        script.defer = true;
        script.onerror = () => reject(new Error('Google Maps script failed to load'));
        document.head.appendChild(script);
      });
      return window.__bounceMapsPromise;
    }
    function drawBounceMap(elementId, points, zoom) {
      const el = document.getElementById(elementId);
      if (!el || !window.google?.maps) return;
      const center = points[0];
      const map = new google.maps.Map(el, { center, zoom, disableDefaultUI: true, zoomControl: true });
      points.forEach((point, index) => new google.maps.Marker({ position: point, map, label: String(index + 1), title: point.label }));
    }
    function ensureGoogleMapsRendered() {
      const mapTargets = [
        ['planning-google-map', BOUNCE_MAP_POINTS.planning, 11],
        ['flock-google-map', BOUNCE_MAP_POINTS.flock, 12],
      ].filter(([id]) => document.getElementById(id));
      if (!mapTargets.length) return;
      loadBounceGoogleMapsScript()
        .then(() => mapTargets.forEach(([id, points, zoom]) => drawBounceMap(id, points, zoom)))
        .catch(() => mapTargets.forEach(([id, points]) => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = renderMapFallback(points);
        }));
    }
    function planningTrip() { return tripById(state.tripId) || DEMO_TRIPS.find((trip) => trip.state === 'planning') || DEMO_TRIPS[0]; }
    function renderPlanningHero(title, subtitle) {
      const trip = planningTrip();
      const roleCopy = canEditPlanning() ? 'Admin roles can rebalance timing, budget, and options.' : 'Members can suggest changes, but organisers edit the plan.';
      return `<section class="card card-purple"><span class="tag tag-lime">Planning · ${trip.city}</span><h1>${title}</h1><p>${subtitle}</p><p>${roleCopy}</p></section>`;
    }
    function renderActivityCard(activity) {
      const menu = canEditPlanning() ? `<button class="activity-menu" aria-label="Activity options">⋯</button>` : `<span class="tag tag-purple">View only</span>`;
      return `<article class="activity-card"><span class="activity-time">${activity.time}</span><span><strong>${activity.title}</strong><br><span class="muted">${activity.meta}</span></span>${menu}</article>`;
    }
    function renderBudgetCard() {
      const trip = planningTrip();
      return `<aside class="card budget-card"><span class="tag tag-lime">BudgetCard</span><h2>Budget</h2><p class="muted">${trip.budget.currency} ${trip.budget.total} total · ${trip.budget.currency} ${trip.budget.perDay}/person/day target</p><div class="budget-input-grid"><label><strong>Total budget</strong><input id="budget-total-input" value="${trip.budget.total}" inputmode="numeric"></label><label><strong>Per-day target</strong><input id="budget-per-day-input" value="${trip.budget.perDay}" inputmode="numeric"></label></div><div class="budget-save-row is-anchored"><span class="profile-feedback" aria-live="polite">${state.budgetFeedback}</span><button class="btn btn-lime" onclick="saveBudgetDraft()">Save budget</button></div></aside>`;
    }
    function renderPlanningItineraryScreen() {
      const activeDay = PLANNING_DAYS[state.activePlanningDay] || PLANNING_DAYS[0];
      const dayRail = PLANNING_DAYS.map((day, index) => `<button class="${index === state.activePlanningDay ? 'active' : ''}" onclick="setPlanningDay(${index})">${day.day}</button>`).join('');
      const toggles = ['Timeline', 'Map'].map((view) => `<button class="${state.planningView === view ? 'active' : ''}" onclick="setPlanningView('${view}')">${view}</button>`).join('');
      const planningMap = renderGoogleMapCard('planning-google-map', 'Real Google map · Lisbon planning route', BOUNCE_MAP_POINTS.planning);
      window.setTimeout(ensureGoogleMapsRendered, 0);
      return renderShell(`<section class="planning-layout">${renderPlanningHero('Lisbon planning board', 'Itinerary, budget, map, flights, and suggestions for Maya’s 30th.')}<div class="planning-day-rail" aria-label="Planning day rail">${dayRail}</div><div class="planning-main-grid"><section class="card"><div class="view-toggle" aria-label="Itinerary view toggle">${toggles}</div><h2>${activeDay.day}: ${activeDay.title}</h2>${activeDay.activities.map(renderActivityCard).join('')}</section><div class="planning-layout">${renderBudgetCard()}${planningMap}</div></div></section>`);
    }
    function renderPlanningFlightsScreen() {
      const groups = FLIGHT_GROUPS.map((group) => `<section class="card flight-group"><h2>${group.origin}</h2>${group.options.map((option) => `<article class="flight-option"><span><strong>${option.airline}</strong><br><span class="muted">${option.time} · ${option.price}</span></span><span class="tag ${option.risk === 'Low risk' ? 'tag-lime' : option.risk === 'Medium risk' ? 'tag-orange' : 'tag-purple'}">${option.risk}</span></article>`).join('')}</section>`).join('');
      return renderShell(`<section class="planning-layout">${renderPlanningHero('Flight options by origin', 'Three visible options per origin group, with demo risk labels for judge review.')}<div class="planning-layout">${groups}</div></section>`);
    }
    function renderPlanningSuggestionsScreen() {
      const cards = SUGGESTIONS.map((item) => `<article class="card suggestion-card"><span class="tag tag-lime">${item.status}</span><h2>${item.title}</h2><p class="muted">Suggested by ${item.by}. ${item.note}</p>${canEditPlanning() ? '<button class="btn btn-primary">Review suggestion</button>' : '<span class="tag tag-purple">Waiting for organiser</span>'}</article>`).join('');
      return renderShell(`<section class="planning-layout">${renderPlanningHero('Pending suggestions', 'Two local suggestions are ready for organiser review.')}<div class="suggestions-list">${cards}</div></section>`);
    }


    function activeTrip() { return tripById(state.tripId) || DEMO_TRIPS.find((trip) => trip.state === 'active') || DEMO_TRIPS[1]; }
    function activeHero(title, subtitle) {
      const trip = activeTrip();
      return `<section class="card card-purple"><span class="tag tag-lime">Tokyo Day ${trip.activeDay}</span><h1>${title}</h1><p>${subtitle}</p><p>${trip.name} · ${trip.city} · Day ${trip.activeDay}/${trip.totalDays}</p></section>`;
    }
    function openDisruptionModal() { state.disruptionOpen = true; renderApp(); }
    function closeDisruptionModal() { state.disruptionOpen = false; renderApp(); }
    function setActiveFlock(id) { state.activeFlock = id; renderApp(); }
    function setExpenseSplitMode(mode) { state.expenseSplitMode = mode; state.expenseFeedback = 'Expense split updated locally'; renderApp(); }
    function setExpenseCategory(category) { state.expenseCategory = category; state.expenseFeedback = 'Expense split updated locally'; renderApp(); }
    function toggleEmptyAlerts() { state.showEmptyAlerts = !state.showEmptyAlerts; renderApp(); }
    function renderDisruptionModal() {
      if (!state.disruptionOpen) return '';
      return `<div class="modal-backdrop" role="presentation"><section class="card disruption-modal" role="dialog" aria-label="Disruption alternatives"><span class="tag tag-orange">Disruption</span><h2>Rain is about to hit Shinjuku</h2><p class="muted">Pick one deterministic L1 alternative for the demo.</p>${DISRUPTION_OPTIONS.map((option) => `<article class="card"><strong>${option.title}</strong><p class="muted">${option.impact}</p></article>`).join('')}<div class="quick-action-grid"><button class="btn btn-lime" onclick="closeDisruptionModal()">Lock this in & ping everyone →</button><button class="btn btn-ghost" onclick="closeDisruptionModal()">Not now</button></div></section></div>`;
    }
    function renderActiveTodayScreen() {
      const cards = ACTIVE_TODAY.map((item) => `<article class="today-card"><span class="activity-time">${item.time}</span><span><strong>${item.title}</strong><br><span class="muted">${item.meta}</span></span></article>`).join('');
      return renderShell(`<section class="planning-layout">${activeHero('Tokyo Day 3', 'Today keeps the active trip moving with quick local actions.')}<div class="active-today-grid"><section class="card"><h2>Today schedule</h2>${cards}</section><aside class="card"><h2>Quick actions</h2><div class="quick-action-grid"><button class="btn btn-primary">Ping late group</button><button class="btn btn-lime" onclick="setPhase('active-flock')">Open FlockMode</button><button class="btn btn-ghost" onclick="openDisruptionModal()">Trigger disruption</button></div></aside></div></section>${renderDisruptionModal()}`);
    }
    function renderActiveFlockScreen() {
      const flock = FLOCKS.find((item) => item.id === state.activeFlock) || FLOCKS[0];
      const switcher = FLOCKS.map((item) => `<button class="${item.id === flock.id ? 'active' : ''}" onclick="setActiveFlock('${item.id}')">${item.label}</button>`).join('');
      const schedule = flock.schedule.map((item) => `<li>${item}</li>`).join('');
      window.setTimeout(ensureGoogleMapsRendered, 0);
      return renderShell(`<section class="planning-layout">${activeHero('FlockMode', 'Switcher, active flock schedule, countdown, and real Google map.')}<div class="flock-switcher" aria-label="FlockMode switcher">${switcher}</div><div class="active-today-grid"><section class="card"><span class="countdown-chip">${flock.countdown}</span><h2>active flock schedule</h2><ul>${schedule}</ul><p class="profile-readonly-note">Photo sharing placeholder — uploads stay CUT in L1.</p></section>${renderGoogleMapCard('flock-google-map', 'Real Google map · Tokyo FlockMode', BOUNCE_MAP_POINTS.flock)}</div></section>`);
    }
    function renderActiveExpensesScreen() {
      const modes = SPLIT_MODES.map((mode) => `<button class="${state.expenseSplitMode === mode ? 'active' : ''}" onclick="setExpenseSplitMode('${mode}')">${mode}</button>`).join('');
      const categories = EXPENSE_CATEGORIES.map((item) => `<button class="${state.expenseCategory === item.category ? 'active' : ''}" onclick="setExpenseCategory('${item.category}')">${item.category}<br><span>${item.amount}</span></button>`).join('');
      return renderShell(`<section class="planning-layout">${activeHero('Trip expenses', 'Four split modes and six local categories update without storage.')}<section class="card"><h2>Split mode</h2><div class="expense-mode-grid">${modes}</div></section><section class="card"><h2>Categories</h2><div class="expense-category-grid">${categories}</div><p class="profile-feedback" aria-live="polite">${state.expenseFeedback}</p></section></section>`);
    }
    function renderActiveAlertsScreen() {
      const body = state.showEmptyAlerts ? `<section class="card"><h2>No alerts for this view</h2><p class="muted">Everything is calm after filters.</p></section>` : `<div class="alert-list">${ALERTS.map((alert) => `<article class="card alert-card"><span class="tag tag-orange">Active alert</span><h2>${alert.title}</h2><p class="muted">${alert.detail}</p></article>`).join('')}</div>`;
      return renderShell(`<section class="planning-layout">${activeHero('Alerts', 'Populated and empty states for active trip operations.')}<button class="btn btn-ghost" onclick="toggleEmptyAlerts()">${state.showEmptyAlerts ? 'Show populated alerts' : 'Show empty state'}</button>${body}</section>`);
    }


    function renderWrapScreen() {
      const trip = tripById(state.tripId) || DEMO_TRIPS.find((item) => item.state === 'past') || DEMO_TRIPS[2];
      const wrap = WRAP_DATA[trip.id] || WRAP_DATA['cdmx-reunion'];
      const categories = wrap.categoryBreakdown.map(([label, amount]) => `<article class="wrap-category-card"><strong>${label}</strong><br><span class="muted">${amount}</span></article>`).join('');
      const settlements = wrap.settlements.map((item) => `<li>${item}</li>`).join('');
      return renderShell(`<section class="planning-layout"><section class="card card-purple"><span class="tag tag-lime">Post-trip wrap</span><h1>${trip.name}</h1><p>${trip.city} · ${trip.dates}</p><p>${wrap.note}</p></section><section class="wrap-summary-grid"><article class="card"><span class="tag tag-purple">Total</span><h2>${wrap.total}</h2><p class="muted">Destination local currency only: ${wrap.currency}</p></article><article class="card"><span class="tag tag-lime">Per person</span><h2>${wrap.perPerson}</h2><p class="muted">No conversion shown in L1.</p></article><article class="card bouncesay-card"><strong>BounceSay insight</strong><p>${wrap.bounceSay}</p></article></section><section class="card"><h2>Category breakdown</h2><div class="wrap-category-grid">${categories}</div></section><section class="card"><h2>Settlements</h2><ul class="wrap-settlement-list">${settlements}</ul></section></section>`);
    }


    function permissionLabelForRole() {
      if (state.role === 'co-leader') return 'Organiser/Co-leader can edit plans, budgets, and alerts.';
      if (state.role === 'flock-leader') return 'Flock leader can guide meetups and disruption pivots.';
      if (state.role === 'member') return 'Member can suggest ideas and view group decisions.';
      return 'Organiser/Co-leader can edit plans, budgets, and alerts.';
    }
    function deterministicBounceResponse() {
      const index = state.bounceMessages.filter((message) => message.sender === 'Bounce').length % BOUNCE_RESPONSES.length;
      return BOUNCE_RESPONSES[index];
    }
    function openBounceAssistant() { state.isBounceOpen = true; renderApp(); }
    function closeBounceAssistant() { state.isBounceOpen = false; renderApp(); }
    function sendBounceMessage() {
      const input = document.getElementById('bounce-pill-input');
      const text = input ? input.value.trim() : state.bounceInput.trim();
      if (!text) return;
      state.bounceInput = '';
      state.bounceMessages = [...state.bounceMessages, { sender: 'You', text }, { sender: 'Bounce', text: deterministicBounceResponse() }];
      state.isBounceOpen = true;
      renderApp();
    }
    function renderBounceAssistantPanel() {
      if (!state.isBounceOpen) return '';
      const messages = state.bounceMessages.map((message) => `<div class="bounce-message ${message.sender === 'You' ? 'user' : ''}"><strong>${message.sender}</strong><p>${message.text}</p></div>`).join('');
      return `<section class="card bounce-chat-panel" role="dialog" aria-modal="false" aria-label="Bounce assistant"><header class="bounce-chat-header"><span class="bounce-avatar bounce-avatar-sm" aria-hidden="true">B</span><div><strong>Bounce assistant</strong><br><span class="permission-label">${permissionLabelForRole()}</span></div><button class="btn btn-ghost" aria-label="Close Bounce assistant" onclick="closeBounceAssistant()">×</button></header><div class="bounce-message-stream" aria-live="polite">${messages}</div><div class="bounce-pill-input"><input id="bounce-pill-input" placeholder="Ask Bounce about this demo…" value="${state.bounceInput}" oninput="state.bounceInput=this.value"><button class="btn btn-lime" onclick="sendBounceMessage()">Send</button></div></section>`;
    }
    function renderChatScreen() {
      state.isBounceOpen = true;
      return renderShell(`<section class="card card-purple"><span class="tag tag-lime">Bounce</span><h1>Chat with Bounce</h1><p>${permissionLabelForRole()}</p><p>L1 responses are deterministic and offline.</p></section>`);
    }

    function renderTripScreen() {
      const trip = tripById(state.tripId) || DEMO_TRIPS[0];
      const wrap = WRAP_DATA[trip.id];
      return renderShell(`<section class="card card-purple"><span class="tag tag-lime">${trip.state}</span><h1>${trip.name}</h1><p>${trip.city} · ${trip.dates}</p><p>Route contract: ${ROUTES.join(' · ')}</p>${trip.state === 'active' ? `<p>Day ${trip.activeDay}/${trip.totalDays}: keep the flock together.</p>` : ''}${wrap ? `<p>Total spent: ${wrap.total} · ${wrap.perPerson}. ${wrap.note}</p>` : ''}<button class="btn btn-ghost" onclick="setTripContext(null)">Back to Home</button></section>`);
    }

    function renderJudgePanel() {
      const positionStyle = state.judgePosition ? ` style="left: ${state.judgePosition.x}px; bottom: auto; top: ${state.judgePosition.y}px;"` : '';
      const phases = [['home', 'Home'], ['planning-itinerary', 'Planning'], ['active-today', 'Active'], ['wrap', 'Past wrap'], ['chat', 'Chat']];
      const phaseOptions = phases.map(([value, label]) => `<option value="${value}" ${state.phase === value ? 'selected' : ''}>${label}</option>`).join('');
      return `<aside class="judge-panel" aria-label="Demo controls"${positionStyle} onpointermove="moveJudgeDrag(event)" onpointerup="endJudgeDrag()" onpointercancel="endJudgeDrag()"><button class="judge-panel-pill" aria-expanded="${state.isJudgeOpen}" onpointerdown="startJudgeDrag(event)" onclick="toggleJudgePanel()"><span>⚡ Demo controls</span><span>drag me</span></button>${state.isJudgeOpen ? `<div class="judge-panel-body"><strong>⚡ Demo controls · drag me</strong><label>Role</label><select onchange="setRole(this.value)"><option value="organiser" ${state.role === 'organiser' ? 'selected' : ''}>Organiser</option><option value="co-leader" ${state.role === 'co-leader' ? 'selected' : ''}>Co-leader</option><option value="flock-leader" ${state.role === 'flock-leader' ? 'selected' : ''}>Flock leader</option><option value="member" ${state.role === 'member' ? 'selected' : ''}>Member</option></select><label>Phase</label><select onchange="setDemoPhase(this.value)">${phaseOptions}</select><div class="judge-actions"><button class="btn btn-lime" onclick="triggerDemoDisruption()">Trigger disruption</button><button class="btn btn-ghost" onclick="resetDemoControls()">Reset demo controls</button></div><small aria-live="polite">${state.judgeFeedback}</small></div>` : ''}</aside>`;
    }

    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;
      if (state.phase === 'profile') { app.innerHTML = renderProfileScreen(); return; }
      if (state.phase === 'planning-itinerary') { app.innerHTML = renderPlanningItineraryScreen(); return; }
      if (state.phase === 'planning-flights') { app.innerHTML = renderPlanningFlightsScreen(); return; }
      if (state.phase === 'planning-suggestions') { app.innerHTML = renderPlanningSuggestionsScreen(); return; }
      if (state.phase === 'active-today') { app.innerHTML = renderActiveTodayScreen(); return; }
      if (state.phase === 'active-flock') { app.innerHTML = renderActiveFlockScreen(); return; }
      if (state.phase === 'active-expenses') { app.innerHTML = renderActiveExpensesScreen(); return; }
      if (state.phase === 'active-alerts') { app.innerHTML = renderActiveAlertsScreen(); return; }
      if (state.phase === 'wrap') { app.innerHTML = renderWrapScreen(); return; }
      if (state.phase === 'chat') { app.innerHTML = renderChatScreen(); return; }
      if (state.tripId) { app.innerHTML = renderTripScreen(); return; }
      if (state.phase === 'plan') { app.innerHTML = renderEntryScreen(); return; }
      if (state.phase === 'home') { app.innerHTML = renderHomeScreen(); return; }
      app.innerHTML = renderHomeScreen();
    }

    window.addEventListener('hashchange', applyHashRoute);
    applyHashRoute();
  </script>
</body>
</html>
