<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bounce v5 L1 prototype</title>
  <style>
    :root {
      --purple: #1A0A6B;
      --purple-mid: #4A2FC4;
      --purple-light: #6B50E8;
      --purple-tint: #EDE9FF;
      --lime: #C8E64A;
      --lime-dark: #8DC63F;
      --lime-tint: #F0FFD4;
      --lime-text: #3A5200;
      --orange: #F47B20;
      --orange-yellow: #FBBF24;
      --orange-tint: #FFF7ED;
      --success: #16A34A;
      --success-tint: #F0FDF4;
      --warning: #D97706;
      --warning-tint: #FFF7ED;
      --danger: #DC2626;
      --danger-tint: #FEF2F2;
      --danger-text: #7F1D1D;
      --cat-food: #F47B20;
      --cat-culture: #7C3AED;
      --cat-nature: #16A34A;
      --cat-transport: #1A0A6B;
      --cat-shopping: #EC4899;
      --cat-hotel: #C8E64A;
      --cat-nightlife: #4A2FC4;
      --cat-wellness: #0D9488;
      --bg-page: #FAF8FF;
      --bg-card: #FFFFFF;
      --bg-raised: #FAFAFA;
      --text-primary: #1A1A2E;
      --text-secondary: #5B5F6E;
      --text-tertiary: #9CA3AF;
      --text-inverse: #FFFFFF;
      --border-light: #ECE9F4;
      --border-medium: #D1CEDB;
      --border-strong: #9CA3AF;
      --font-logo: 'Baloo 2', system-ui, cursive;
      --font-display: 'Nunito', system-ui, sans-serif;
      --font-sans: 'Nunito', system-ui, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      --text-xs: 11px;
      --text-sm: 13px;
      --text-base: 15px;
      --text-md: 17px;
      --text-lg: 20px;
      --text-xl: 26px;
      --text-2xl: 34px;
      --text-3xl: 48px;
      --leading-tight: 1.2;
      --leading-normal: 1.5;
      --leading-relaxed: 1.65;
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;
      --sp-16: 64px;
      --r-xs: 6px;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --r-xl: 24px;
      --r-2xl: 30px;
      --r-pill: 99px;
      --shadow-card: 0 1px 3px rgba(26,10,107,.05), 0 0 0 .5px rgba(26,10,107,.04);
      --shadow-raised: 0 6px 20px rgba(26,10,107,.08);
      --shadow-float: 0 12px 36px rgba(26,10,107,.14);
      --shadow-bounce: 0 6px 28px rgba(26,10,107,.32);
      --z-nav: 100;
      --z-chat: 200;
      --z-overlay: 300;
      --z-toast: 400;
      --z-judge: 500;
      --t-fast: 140ms ease;
      --t-normal: 220ms ease;
      --t-slow: 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--font-sans); font-size: var(--text-base); background: var(--bg-page); color: var(--text-primary); }
    button, select { font: inherit; }
    .app-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: var(--purple); color: var(--text-inverse); padding: var(--sp-6) 18px; display: flex; flex-direction: column; gap: var(--sp-5); }
    .logomark { display: inline-flex; align-items: center; gap: var(--sp-2); font-family: var(--font-logo); font-weight: 900; font-size: var(--text-2xl); letter-spacing: -.03em; color: var(--text-inverse); text-decoration: none; }
    .logomark-o { color: var(--lime); text-shadow: 0 0 18px rgba(200,230,74,.35); }
    .bounce-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--purple); color: var(--lime); font-family: var(--font-logo); font-weight: 800; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--lime); }
    .bounce-avatar-sm { width: 28px; height: 28px; font-size: 14px; border-width: 1.5px; }
    .bounce-avatar-lg { width: 72px; height: 72px; font-size: 36px; box-shadow: var(--shadow-bounce); }
    .nav { display: grid; gap: var(--sp-2); }
    .nav button { text-align: left; background: transparent; color: rgba(255,255,255,.74); display: flex; align-items: center; gap: var(--sp-3); padding: 11px var(--sp-4); border-radius: var(--r-lg); border: 0; font-weight: 700; cursor: pointer; transition: var(--t-fast); }
    .nav button:hover { background: rgba(255,255,255,.08); color: var(--text-inverse); }
    .nav button.active { background: var(--lime); color: var(--purple); font-weight: 900; }
    .trip-card-context { border-left: 3px solid var(--lime); background: rgba(255,255,255,.06); border-radius: var(--r-md); padding: var(--sp-4); }
    .page-body { max-width: 1320px; margin: 0 auto; padding: var(--sp-8); }
    .hero { position: relative; overflow: hidden; background: var(--purple); color: var(--text-inverse); border-radius: var(--r-2xl); padding: var(--sp-8); display: grid; gap: var(--sp-3); box-shadow: var(--shadow-bounce); }
    .hero::after { content: ''; position: absolute; width: 220px; height: 220px; right: -72px; top: -72px; border-radius: 50%; background: var(--orange-tint); opacity: .22; }
    .hero h1 { position: relative; margin: 0; font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: -.02em; }
    .hero p { position: relative; margin: 0; color: rgba(255,255,255,.82); line-height: var(--leading-relaxed); }
    .btn { border: 0; border-radius: var(--r-pill); padding: 12px 22px; font-weight: 900; cursor: pointer; transition: var(--t-fast); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--purple-mid); color: var(--text-inverse); }
    .btn-primary:hover { background: var(--purple-light); }
    .btn-lime { background: var(--lime); color: var(--lime-text); }
    .btn-ghost { background: transparent; color: var(--purple); border: 1px solid var(--border-light); }
    .button-primary { background: var(--lime); color: var(--lime-text); border: 0; border-radius: var(--r-pill); padding: 12px 18px; font-weight: 900; cursor: pointer; }
    .home-plan-new { width: 100%; border: 0; text-align: left; border-radius: var(--r-2xl); padding: var(--sp-6); background: linear-gradient(135deg, var(--purple), var(--purple-mid)); color: var(--text-inverse); display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: var(--sp-4); box-shadow: var(--shadow-bounce); cursor: pointer; }
    .home-plan-new-icon { width: 56px; height: 56px; border-radius: var(--r-lg); background: var(--lime); color: var(--lime-text); display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-2xl); font-weight: 900; }
    .home-plan-new-body { display: grid; gap: var(--sp-1); }
    .home-plan-new-title { font-size: var(--text-xl); font-weight: 900; }
    .home-plan-new-sub { color: rgba(255,255,255,.82); line-height: var(--leading-normal); }
    .home-plan-new-arrow { font-size: var(--text-2xl); color: var(--lime); }
    .trips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); margin-top: var(--sp-4); }
    .trip-card { display: block; width: 100%; text-align: left; padding: 0; overflow: hidden; cursor: pointer; }
    .trip-cover { height: 180px; padding: var(--sp-4); background: var(--purple-tint); display: flex; align-items: flex-start; justify-content: flex-start; }
    .trip-state-badge { display: inline-flex; }
    .trip-meta { display: grid; gap: var(--sp-2); padding: var(--sp-5); }
    .trip-name { margin: 0; font-size: var(--text-md); font-weight: 900; color: var(--text-primary); }
    .avatar-stack { display: flex; align-items: center; margin-top: var(--sp-2); }
    .avatar-stack .member-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--purple); color: var(--lime); border: 2px solid var(--bg-card); display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: 900; margin-left: -6px; }
    .avatar-stack .member-avatar:first-child { margin-left: 0; }
    .card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--r-xl); padding: var(--sp-5); box-shadow: var(--shadow-card); }
    .card-purple { background: var(--purple); color: var(--text-inverse); border-color: var(--purple); }
    .card-lime { background: var(--lime-tint); border-color: var(--lime-dark); }
    .card-elevated { box-shadow: var(--shadow-raised); }
    .tag { display: inline-flex; border-radius: var(--r-pill); padding: 4px 10px; font-size: var(--text-xs); font-weight: 900; }
    .tag-lime { background: var(--lime-tint); color: var(--lime-text); border: 1px solid var(--lime-dark); }
    .tag-purple { background: var(--purple-tint); color: var(--purple-mid); }
    .tag-orange { background: var(--orange-tint); color: var(--warning); }
    .muted { color: var(--text-secondary); }
    .cut-note { border-style: dashed; background: var(--bg-card); }
    .bounce-fab { position: fixed; right: var(--sp-8); bottom: var(--sp-8); width: 64px; height: 64px; border-radius: 50%; background: var(--purple); color: var(--lime); border: 3px solid var(--lime); box-shadow: var(--shadow-bounce); z-index: var(--z-chat); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-logo); font-size: var(--text-2xl); font-weight: 900; cursor: pointer; }
    .bounce-fab.has-alert::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--lime); animation: pulse-ring 1.8s ease infinite; }
    @keyframes pulse-ring { 0% { transform: scale(.92); opacity: .8; } 70% { transform: scale(1.3); opacity: 0; } 100% { opacity: 0; } }
    .entry-conversation { display: grid; gap: var(--sp-5); }
    .entry-hero { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--sp-5); align-items: center; }
    .entry-mascot { width: 88px; height: 88px; border-radius: 50%; background: var(--purple); color: var(--lime); border: 3px solid var(--lime); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-logo); font-size: var(--text-3xl); font-weight: 900; box-shadow: var(--shadow-bounce); }
    .trip-prompt-textarea { width: 100%; min-height: 132px; resize: vertical; border: 1px solid var(--border-light); border-radius: var(--r-xl); padding: var(--sp-4); font: inherit; line-height: var(--leading-relaxed); }
    .trip-type-chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .trip-type-chip { border: 1px solid var(--border-light); background: var(--bg-card); color: var(--purple); border-radius: var(--r-pill); padding: 8px 12px; font-weight: 800; cursor: pointer; }
    .trip-type-chip.is-selected { background: var(--lime); color: var(--lime-text); border-color: var(--lime-dark); }
    .entry-response { border-left: 4px solid var(--lime-dark); background: var(--lime-tint); border-radius: 0 var(--r-lg) var(--r-lg) 0; padding: var(--sp-4) var(--sp-5); }
    .judge-panel { position: fixed; left: var(--sp-6); bottom: var(--sp-6); z-index: var(--z-judge); background: var(--purple); color: var(--text-inverse); border: 2px solid var(--lime); border-radius: var(--r-xl); padding: var(--sp-3); box-shadow: var(--shadow-float); min-width: 240px; user-select: none; }
    .judge-panel label { display: block; margin: var(--sp-2) 0 var(--sp-1); font-size: var(--text-xs); color: rgba(255,255,255,.75); text-transform: uppercase; font-weight: 900; letter-spacing: .08em; }
    .judge-panel select { width: 100%; border-radius: var(--r-sm); border: 0; padding: var(--sp-2); }
    .user-pill { margin-top: auto; width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: var(--text-inverse); border-radius: var(--r-lg); padding: var(--sp-3); display: flex; align-items: center; gap: var(--sp-3); cursor: pointer; text-align: left; }
    .user-pill:hover { background: rgba(255,255,255,.12); }
    .mobile-topbar { display: none; align-items: center; justify-content: space-between; gap: var(--sp-3); position: sticky; top: 0; z-index: var(--z-nav); background: var(--purple); color: var(--text-inverse); padding: var(--sp-3) var(--sp-4); }
    .mobile-menu-button { width: 40px; height: 40px; border-radius: var(--r-md); border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: var(--text-inverse); font-weight: 900; cursor: pointer; }
    .mobile-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 150; opacity: 0; pointer-events: none; transition: opacity var(--t-normal); }
    .mobile-backdrop.show { opacity: 1; pointer-events: auto; }
    *:focus-visible { outline: 2.5px solid var(--purple-mid); outline-offset: 2px; border-radius: var(--r-xs); }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .mobile-topbar { display: flex; }
      .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100vh; z-index: var(--z-chat); transform: translateX(-100%); transition: transform 260ms cubic-bezier(.4,0,.2,1); }
      .sidebar.open { transform: translateX(0); }
      .page-body { padding: var(--sp-4); }
      .bounce-fab { right: var(--sp-4); bottom: var(--sp-4); }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Bounce v5 L1 prototype"></main>
  <script>
    // Prototype hash route shape: screen=X&phase=Y&user=Z
    const DEMO_TRIPS = [
      {
        id: 'lisbon-bday',
        name: "Maya's 30th",
        city: 'Lisbon', country: 'Portugal',
        dates: 'Jul 12 – Jul 17, 2025',
        state: 'planning',
        daysToGo: 48, totalDays: 6,
        budget: { total: 2950, perDay: 98, currency: 'EUR' },
        members: ['maya', 'sofiaA', 'priyaN', 'chloe', 'zara'],
      },
      {
        id: 'reunion-tk26',
        name: 'The Reunion',
        city: 'Tokyo', country: 'Japan',
        dates: 'Oct 15 – Oct 21, 2026',
        state: 'active',
        activeDay: 3, totalDays: 7,
        members: ['alex', 'priya', 'marcus', 'sofia', 'jake', 'aditya', 'emma', 'carlos', 'liam', 'rania'],
      },
      { id: 'cdmx-reunion', name: 'CDMX reunion', city: 'Mexico City', country: 'Mexico', dates: 'Jun 2025', state: 'past', travelers: 4, rating: '4.9' },
      { id: 'seoul-food-crawl', name: 'Seoul food crawl', city: 'Seoul', country: 'South Korea', dates: 'Nov 2025', state: 'past', travelers: 6, rating: '4.8' },
      { id: 'lisbon-long-weekend', name: 'Lisbon long weekend', city: 'Lisbon', country: 'Portugal', dates: 'Apr 2026', state: 'past', travelers: 4, rating: '4.9' }
    ];
    const WRAP_DATA = {
      'cdmx-reunion': { currency: 'MXN', total: 'MX$37,000', perPerson: 'MX$9,250/person', note: 'Markets, tacos, and easy settling kept the reunion relaxed.' },
      'seoul-food-crawl': { currency: 'KRW', total: '₩5,900,000', perPerson: '₩983,000/person', note: 'Food crawls and late trains made this one feel effortless.' },
      'lisbon-long-weekend': { currency: 'EUR', total: '€1,160', perPerson: '€290/person', note: 'A compact weekend with sunny walks and no budget drama.' }
    };
    const ROUTES = ['/', '/trip/:id', '/trip/:id/plan', '/trip/:id/active', '/trip/:id/flock', '/trip/:id/wrap', '/chat', '/join/:token'];
    const TRIP_TYPE_CHIPS = ['Birthday trip', 'Friends reunion', 'Food crawl', 'Low walking first day', 'Beach reset'];
    const state = { route: '/', role: 'organiser', phase: 'home', tripId: null, screen: 'home', user: 'maya', isDrawerOpen: false, entryPrompt: '', selectedTripChips: ['Friends reunion'], planningResponse: '' };

    function tripById(id) { return DEMO_TRIPS.find((trip) => trip.id === id) || null; }
    function parseHashRoute() {
      const rawHash = window.location.hash.replace(/^#/, '');
      const params = new URLSearchParams(rawHash || 'screen=home');
      return {
        screen: params.get('screen') || 'home',
        phase: params.get('phase') || null,
        user: params.get('user') || state.user,
        tripId: params.get('trip') || null,
      };
    }
    function phaseForTrip(trip) {
      if (!trip) return 'home';
      if (trip.state === 'planning') return 'planning-itinerary';
      if (trip.state === 'active') return 'active-today';
      if (trip.state === 'past') return 'wrap';
      return 'home';
    }
    function routeToTrip(trip) {
      const phase = phaseForTrip(trip);
      const params = new URLSearchParams({ screen: 'trip', phase, user: state.user, trip: trip.id });
      window.location.hash = params.toString();
      return phase;
    }
    function applyHashRoute() {
      const route = parseHashRoute();
      state.screen = route.screen;
      state.user = route.user;
      state.tripId = route.tripId;
      const trip = tripById(route.tripId);
      state.phase = route.phase || phaseForTrip(trip);
      renderApp();
    }
    function closeMobileDrawer() { state.isDrawerOpen = false; }
    function toggleMobileDrawer() { state.isDrawerOpen = !state.isDrawerOpen; renderApp(); }
    function navigate(phase) { state.phase = phase; closeMobileDrawer(); renderApp(); }
    function setTripContext(id) { if (id === null) state.tripId = null; else state.tripId = id; const trip = tripById(id); state.phase = trip ? routeToTrip(trip) : 'home'; if (id === null) window.location.hash = 'screen=home&phase=home&user=' + encodeURIComponent(state.user); closeMobileDrawer(); renderApp(); }
    function setRole(role) { state.role = role; renderApp(); }
    function setPhase(phase) { state.phase = phase; closeMobileDrawer(); renderApp(); }
    function toggleTripChip(chip) {
      state.selectedTripChips = state.selectedTripChips.includes(chip)
        ? state.selectedTripChips.filter((item) => item !== chip)
        : [...state.selectedTripChips, chip];
      renderApp();
    }
    function deterministicPlanningResponse() {
      const interests = state.selectedTripChips.length ? state.selectedTripChips.join(', ') : 'group-friendly days';
      return `Organising everyone's ideas… I’ll shape this around ${interests}. For Lisbon, I’d start with a gentle arrival day, one food-led evening, and a sunny group moment everyone can say yes to.`;
    }
    function submitTripPrompt() {
      const input = document.getElementById('trip-prompt-textarea');
      state.entryPrompt = input ? input.value.trim() : state.entryPrompt;
      state.planningResponse = deterministicPlanningResponse();
      renderApp();
    }

    function renderMobileTopbar() {
      const trip = tripById(state.tripId);
      return `<header class="mobile-topbar"><button class="mobile-menu-button" aria-label="Open navigation" onclick="toggleMobileDrawer()">☰</button><a class="logomark" aria-label="Bounce" href="#" onclick="setTripContext(null); return false;">B<span class="logomark-o">o</span>unce</a><button class="mobile-menu-button" aria-label="Chat with Bounce" onclick="navigate('chat')">B</button>${trip ? `<span class="muted">${trip.city}</span>` : ''}</header>`;
    }

    function renderUserPill() {
      return `<button class="user-pill" onclick="setPhase('profile')"><span class="bounce-avatar bounce-avatar-sm" aria-hidden="true">F</span><span><strong>Fariz</strong><br><small>${state.role}</small></span></button>`;
    }

    function renderTripContextCard(trip) {
      return `<div class="trip-card-context"><strong>${trip.name}</strong><br><span>${trip.city} · ${trip.state}</span></div>`;
    }

    function navButton(label, phase) {
      return `<button class="${state.phase === phase ? 'active' : ''}" onclick="navigate('${phase}')">${label}</button>`;
    }

    function renderGlobalNav() {
      return `<nav class="nav" aria-label="Global navigation">${navButton('Home', 'home')}${navButton('Plan a new trip', 'plan')}${navButton('Join a trip', 'join')}</nav>`;
    }

    function renderTripNav(trip) {
      let items = [];
      if (trip.state === 'planning') items = [['Itinerary', 'planning-itinerary'], ['Flights', 'planning-flights'], ['Suggestions', 'planning-suggestions'], ['FlockMode', 'planning-flock']];
      if (trip.state === 'active') items = [['Today', 'active-today'], ['On the trip', 'active-trip'], ['FlockMode', 'active-flock'], ['Expenses', 'active-expenses'], ['Alerts', 'active-alerts']];
      if (trip.state === 'past') items = [['Wrapped', 'wrap']];
      return `<nav class="nav" aria-label="Trip navigation"><button onclick="setTripContext(null)">← All trips</button>${items.map(([label, phase]) => navButton(label, phase)).join('')}</nav>`;
    }

    function renderShell(content) {
      const trip = tripById(state.tripId);
      return `${renderMobileTopbar()}<div class="mobile-backdrop ${state.isDrawerOpen ? 'show' : ''}" onclick="closeMobileDrawer(); renderApp();"></div><div class="app-shell">
        <aside class="sidebar ${state.isDrawerOpen ? 'open' : ''}">
          <a class="logomark" aria-label="Bounce" href="#" onclick="setTripContext(null); return false;">B<span class="logomark-o">o</span>unce</a>
          ${trip ? renderTripContextCard(trip) + renderTripNav(trip) : renderGlobalNav()}
          ${renderUserPill()}
        </aside>
        <section class="page-body">${content}</section>
      </div><button class="bounce-fab has-alert" aria-label="Chat with Bounce">B</button>${renderJudgePanel()}`;
    }

    function renderHomeScreen() {
      const upcoming = DEMO_TRIPS.filter((trip) => trip.state === 'planning');
      const active = DEMO_TRIPS.filter((trip) => trip.state === 'active');
      const past = DEMO_TRIPS.filter((trip) => trip.state === 'past');
      return renderShell(`<button class="home-plan-new" onclick="setPhase('plan')"><span class="home-plan-new-icon">+</span><span class="home-plan-new-body"><span class="home-plan-new-title">Plan a new trip</span><span class="home-plan-new-sub">Your trip starts here. Tell me what you've got in mind.</span></span><span class="home-plan-new-arrow">→</span></button>${renderTripSection('Upcoming trips', upcoming)}${renderTripSection('On the road right now', active)}${renderTripSection('Past trips', past)}<section class="card cut-note"><strong>Prototype boundaries</strong><p>Photo sharing coming soon</p><p>Multi-city trips are future scope</p><p>Travel DNA is removed</p></section>`);
    }

    function tripStateBadge(trip) {
      if (trip.state === 'planning') return 'In planning';
      if (trip.state === 'active') return `● Day ${trip.activeDay}/${trip.totalDays}`;
      return `⭐ ${trip.rating || '4.9'}`;
    }

    function renderAvatarStack(trip) {
      const members = trip.members || Array.from({ length: trip.travelers || 1 }, (_, index) => `guest${index + 1}`);
      return `<span class="avatar-stack" aria-label="${members.length} travellers">${members.slice(0, 5).map((member) => `<span class="member-avatar">${member.slice(0, 1).toUpperCase()}</span>`).join('')}</span>`;
    }

    function renderTripCard(trip) {
      const coverClass = trip.state === 'active' ? 'tag-orange' : trip.state === 'past' ? 'tag-purple' : 'tag-lime';
      return `<button class="card trip-card card-elevated" onclick="setTripContext('${trip.id}')" aria-label="Open ${trip.name}"><span class="trip-cover"><span class="trip-state-badge"><span class="tag ${coverClass}">${tripStateBadge(trip)}</span></span></span><span class="trip-meta"><span class="trip-name">${trip.name}</span><span class="muted">${trip.dates} · ${trip.city}${trip.daysToGo ? ` · ${trip.daysToGo} days to go` : ''}</span>${renderAvatarStack(trip)}</span></button>`;
    }

    function renderTripSection(title, trips) {
      return trips.length ? `<h2>${title}</h2><div class="trips-grid">${trips.map((trip) => renderTripCard(trip)).join('')}</div>` : '';
    }

    function renderEntryScreen() {
      const response = state.planningResponse || 'Organising everyone\'s ideas… Pick a few trip vibes, then tell Bounce what your group has in mind.';
      return renderShell(`<section class="entry-conversation"><div class="card entry-hero"><div class="entry-mascot" aria-hidden="true">B</div><div><span class="tag tag-lime">Plan a new trip</span><h1>Where should we bounce next?</h1><p class="muted">Your trip starts here. Tell me what you've got in mind.</p></div></div><div class="card"><label for="trip-prompt-textarea"><strong>Tell Bounce about the trip</strong></label><textarea id="trip-prompt-textarea" class="trip-prompt-textarea" placeholder="e.g. Five friends, Lisbon in July, food, music, not too much walking…">${state.entryPrompt}</textarea><p><strong>What kind of trip is this?</strong></p><div class="trip-type-chips">${TRIP_TYPE_CHIPS.map((chip) => `<button class="trip-type-chip ${state.selectedTripChips.includes(chip) ? 'is-selected' : ''}" onclick="toggleTripChip('${chip}')">${chip}</button>`).join('')}</div><div style="margin-top: var(--sp-4)"><button class="btn btn-primary" onclick="submitTripPrompt()">Ready to bounce →</button></div></div><div class="entry-response"><strong>Bounce</strong><p>${response}</p></div></section>`);
    }

    function renderTripScreen() {
      const trip = tripById(state.tripId) || DEMO_TRIPS[0];
      const wrap = WRAP_DATA[trip.id];
      return renderShell(`<section class="card card-purple"><span class="tag tag-lime">${trip.state}</span><h1>${trip.name}</h1><p>${trip.city} · ${trip.dates}</p><p>Route contract: ${ROUTES.join(' · ')}</p>${trip.state === 'active' ? `<p>Day ${trip.activeDay}/${trip.totalDays}: keep the flock together.</p>` : ''}${wrap ? `<p>Total spent: ${wrap.total} · ${wrap.perPerson}. ${wrap.note}</p>` : ''}<button class="btn btn-ghost" onclick="setTripContext(null)">Back to Home</button></section>`);
    }

    function renderJudgePanel() {
      return `<aside class="judge-panel" aria-label="Demo controls"><strong>⚡ Demo controls · drag me</strong><label>Role</label><select onchange="setRole(this.value)"><option value="organiser">Organiser</option><option value="co-leader">Co-leader</option><option value="member">Member</option></select><label>Phase</label><select onchange="setPhase(this.value)"><option value="home">Home</option><option value="planning">Planning</option><option value="active">Active</option><option value="past">Past</option></select></aside>`;
    }

    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;
      if (state.tripId) { app.innerHTML = renderTripScreen(); return; }
      if (state.phase === 'plan') { app.innerHTML = renderEntryScreen(); return; }
      if (state.phase === 'home') { app.innerHTML = renderHomeScreen(); return; }
      app.innerHTML = renderHomeScreen();
    }

    window.addEventListener('hashchange', applyHashRoute);
    applyHashRoute();
  </script>
</body>
</html>
