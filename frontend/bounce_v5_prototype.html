<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bounce v5 L1 prototype</title>
  <style>
    :root {
      --purple: #1A0A6B;
      --purple-mid: #4A2FC4;
      --purple-light: #6B50E8;
      --purple-tint: #EDE9FF;
      --lime: #C8E64A;
      --lime-dark: #8DC63F;
      --lime-tint: #F0FFD4;
      --lime-text: #3A5200;
      --orange: #F47B20;
      --orange-yellow: #FBBF24;
      --orange-tint: #FFF7ED;
      --success: #16A34A;
      --success-tint: #F0FDF4;
      --warning: #D97706;
      --warning-tint: #FFF7ED;
      --danger: #DC2626;
      --danger-tint: #FEF2F2;
      --danger-text: #7F1D1D;
      --cat-food: #F47B20;
      --cat-culture: #7C3AED;
      --cat-nature: #16A34A;
      --cat-transport: #1A0A6B;
      --cat-shopping: #EC4899;
      --cat-hotel: #C8E64A;
      --cat-nightlife: #4A2FC4;
      --cat-wellness: #0D9488;
      --bg-page: #FAF8FF;
      --bg-card: #FFFFFF;
      --bg-raised: #FAFAFA;
      --text-primary: #1A1A2E;
      --text-secondary: #5B5F6E;
      --text-tertiary: #9CA3AF;
      --text-inverse: #FFFFFF;
      --border-light: #ECE9F4;
      --border-medium: #D1CEDB;
      --border-strong: #9CA3AF;
      --font-logo: 'Baloo 2', system-ui, cursive;
      --font-display: 'Nunito', system-ui, sans-serif;
      --font-sans: 'Nunito', system-ui, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      --text-xs: 11px;
      --text-sm: 13px;
      --text-base: 15px;
      --text-md: 17px;
      --text-lg: 20px;
      --text-xl: 26px;
      --text-2xl: 34px;
      --text-3xl: 48px;
      --leading-tight: 1.2;
      --leading-normal: 1.5;
      --leading-relaxed: 1.65;
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;
      --sp-16: 64px;
      --r-xs: 6px;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --r-xl: 24px;
      --r-2xl: 30px;
      --r-pill: 99px;
      --shadow-card: 0 1px 3px rgba(26,10,107,.05), 0 0 0 .5px rgba(26,10,107,.04);
      --shadow-raised: 0 6px 20px rgba(26,10,107,.08);
      --shadow-float: 0 12px 36px rgba(26,10,107,.14);
      --shadow-bounce: 0 6px 28px rgba(26,10,107,.32);
      --z-nav: 100;
      --z-chat: 200;
      --z-overlay: 300;
      --z-toast: 400;
      --z-judge: 500;
      --t-fast: 140ms ease;
      --t-normal: 220ms ease;
      --t-slow: 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--font-sans); font-size: var(--text-base); background: var(--bg-page); color: var(--text-primary); }
    button, select { font: inherit; }
    .app-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: var(--purple); color: var(--text-inverse); padding: var(--sp-6) 18px; display: flex; flex-direction: column; gap: var(--sp-5); }
    .logomark { display: inline-flex; align-items: center; gap: var(--sp-2); font-family: var(--font-logo); font-weight: 900; font-size: var(--text-2xl); letter-spacing: -.03em; color: var(--text-inverse); text-decoration: none; }
    .logomark-o { color: var(--lime); text-shadow: 0 0 18px rgba(200,230,74,.35); }
    .bounce-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--purple); color: var(--lime); font-family: var(--font-logo); font-weight: 800; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--lime); }
    .bounce-avatar-sm { width: 28px; height: 28px; font-size: 14px; border-width: 1.5px; }
    .bounce-avatar-lg { width: 72px; height: 72px; font-size: 36px; box-shadow: var(--shadow-bounce); }
    .nav { display: grid; gap: var(--sp-2); }
    .nav button { text-align: left; background: transparent; color: rgba(255,255,255,.74); display: flex; align-items: center; gap: var(--sp-3); padding: 11px var(--sp-4); border-radius: var(--r-lg); border: 0; font-weight: 700; cursor: pointer; transition: var(--t-fast); }
    .nav button:hover { background: rgba(255,255,255,.08); color: var(--text-inverse); }
    .nav button.active { background: var(--lime); color: var(--purple); font-weight: 900; }
    .trip-card-context { border-left: 3px solid var(--lime); background: rgba(255,255,255,.06); border-radius: var(--r-md); padding: var(--sp-4); }
    .page-body { max-width: 1320px; margin: 0 auto; padding: var(--sp-8); }
    .hero { position: relative; overflow: hidden; background: var(--purple); color: var(--text-inverse); border-radius: var(--r-2xl); padding: var(--sp-8); display: grid; gap: var(--sp-3); box-shadow: var(--shadow-bounce); }
    .hero::after { content: ''; position: absolute; width: 220px; height: 220px; right: -72px; top: -72px; border-radius: 50%; background: var(--orange-tint); opacity: .22; }
    .hero h1 { position: relative; margin: 0; font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--leading-tight); letter-spacing: -.02em; }
    .hero p { position: relative; margin: 0; color: rgba(255,255,255,.82); line-height: var(--leading-relaxed); }
    .btn { border: 0; border-radius: var(--r-pill); padding: 12px 22px; font-weight: 900; cursor: pointer; transition: var(--t-fast); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--purple-mid); color: var(--text-inverse); }
    .btn-primary:hover { background: var(--purple-light); }
    .btn-lime { background: var(--lime); color: var(--lime-text); }
    .btn-ghost { background: transparent; color: var(--purple); border: 1px solid var(--border-light); }
    .button-primary { background: var(--lime); color: var(--lime-text); border: 0; border-radius: var(--r-pill); padding: 12px 18px; font-weight: 900; cursor: pointer; }
    .trips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); margin-top: var(--sp-4); }
    .card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--r-xl); padding: var(--sp-5); box-shadow: var(--shadow-card); }
    .card-purple { background: var(--purple); color: var(--text-inverse); border-color: var(--purple); }
    .card-lime { background: var(--lime-tint); border-color: var(--lime-dark); }
    .card-elevated { box-shadow: var(--shadow-raised); }
    .tag { display: inline-flex; border-radius: var(--r-pill); padding: 4px 10px; font-size: var(--text-xs); font-weight: 900; }
    .tag-lime { background: var(--lime-tint); color: var(--lime-text); border: 1px solid var(--lime-dark); }
    .tag-purple { background: var(--purple-tint); color: var(--purple-mid); }
    .tag-orange { background: var(--orange-tint); color: var(--warning); }
    .muted { color: var(--text-secondary); }
    .cut-note { border-style: dashed; background: var(--bg-card); }
    .bounce-fab { position: fixed; right: var(--sp-8); bottom: var(--sp-8); width: 64px; height: 64px; border-radius: 50%; background: var(--purple); color: var(--lime); border: 3px solid var(--lime); box-shadow: var(--shadow-bounce); z-index: var(--z-chat); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-logo); font-size: var(--text-2xl); font-weight: 900; cursor: pointer; }
    .bounce-fab.has-alert::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--lime); animation: pulse-ring 1.8s ease infinite; }
    @keyframes pulse-ring { 0% { transform: scale(.92); opacity: .8; } 70% { transform: scale(1.3); opacity: 0; } 100% { opacity: 0; } }
    .judge-panel { position: fixed; left: var(--sp-6); bottom: var(--sp-6); z-index: var(--z-judge); background: var(--purple); color: var(--text-inverse); border: 2px solid var(--lime); border-radius: var(--r-xl); padding: var(--sp-3); box-shadow: var(--shadow-float); min-width: 240px; user-select: none; }
    .judge-panel label { display: block; margin: var(--sp-2) 0 var(--sp-1); font-size: var(--text-xs); color: rgba(255,255,255,.75); text-transform: uppercase; font-weight: 900; letter-spacing: .08em; }
    .judge-panel select { width: 100%; border-radius: var(--r-sm); border: 0; padding: var(--sp-2); }
    .user-pill { margin-top: auto; width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: var(--text-inverse); border-radius: var(--r-lg); padding: var(--sp-3); display: flex; align-items: center; gap: var(--sp-3); cursor: pointer; text-align: left; }
    .user-pill:hover { background: rgba(255,255,255,.12); }
    .mobile-topbar { display: none; align-items: center; justify-content: space-between; gap: var(--sp-3); position: sticky; top: 0; z-index: var(--z-nav); background: var(--purple); color: var(--text-inverse); padding: var(--sp-3) var(--sp-4); }
    .mobile-menu-button { width: 40px; height: 40px; border-radius: var(--r-md); border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: var(--text-inverse); font-weight: 900; cursor: pointer; }
    .mobile-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 150; opacity: 0; pointer-events: none; transition: opacity var(--t-normal); }
    .mobile-backdrop.show { opacity: 1; pointer-events: auto; }
    *:focus-visible { outline: 2.5px solid var(--purple-mid); outline-offset: 2px; border-radius: var(--r-xs); }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .mobile-topbar { display: flex; }
      .sidebar { position: fixed; left: 0; top: 0; width: 280px; height: 100vh; z-index: var(--z-chat); transform: translateX(-100%); transition: transform 260ms cubic-bezier(.4,0,.2,1); }
      .sidebar.open { transform: translateX(0); }
      .page-body { padding: var(--sp-4); }
      .bounce-fab { right: var(--sp-4); bottom: var(--sp-4); }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Bounce v5 L1 prototype"></main>
  <script>
    const DEMO_TRIPS = [
      { id: 'lisbon_planning', name: 'Lisbon Summer Sendoff', city: 'Lisbon', state: 'planning', dates: '12–17 Jun', travelers: 6 },
      { id: 'tokyo_active', name: 'Tokyo Reunion', city: 'Tokyo', state: 'active', activeDay: 3, totalDays: 7, dates: '24–30 May', travelers: 7 },
      { id: 'seoul_past', name: 'Seoul Food Loop', city: 'Seoul', state: 'past', dates: 'Feb 2026', travelers: 4 },
      { id: 'bali_past', name: 'Bali Reset', city: 'Bali', state: 'past', dates: 'Jan 2026', travelers: 5 },
      { id: 'melbourne_past', name: 'Melbourne Long Weekend', city: 'Melbourne', state: 'past', dates: 'Nov 2025', travelers: 3 }
    ];
    const WRAP_DATA = {
      seoul_past: { currency: '₩', total: '1,240,000', note: 'Street food wins kept the group under budget.' },
      bali_past: { currency: 'Rp', total: '9,800,000', note: 'Villas and scooters made this feel easy.' },
      melbourne_past: { currency: 'A$', total: '2,180', note: 'Coffee, galleries, and one excellent tram day.' }
    };
    const ROUTES = ['/', '/trip/:id', '/trip/:id/plan', '/trip/:id/active', '/trip/:id/flock', '/trip/:id/wrap', '/chat', '/join/:token'];
    const state = { route: '/', role: 'organiser', phase: 'home', tripId: null, isDrawerOpen: false };

    function tripById(id) { return DEMO_TRIPS.find((trip) => trip.id === id) || null; }
    function closeMobileDrawer() { state.isDrawerOpen = false; }
    function toggleMobileDrawer() { state.isDrawerOpen = !state.isDrawerOpen; renderApp(); }
    function navigate(phase) { state.phase = phase; closeMobileDrawer(); renderApp(); }
    function setTripContext(id) { if (id === null) state.tripId = null; else state.tripId = id; const trip = tripById(id); state.phase = trip ? trip.state : 'home'; closeMobileDrawer(); renderApp(); }
    function setRole(role) { state.role = role; renderApp(); }
    function setPhase(phase) { state.phase = phase; closeMobileDrawer(); renderApp(); }

    function renderMobileTopbar() {
      const trip = tripById(state.tripId);
      return `<header class="mobile-topbar"><button class="mobile-menu-button" aria-label="Open navigation" onclick="toggleMobileDrawer()">☰</button><a class="logomark" aria-label="Bounce" href="#" onclick="setTripContext(null); return false;">B<span class="logomark-o">o</span>unce</a><button class="mobile-menu-button" aria-label="Chat with Bounce" onclick="navigate('chat')">B</button>${trip ? `<span class="muted">${trip.city}</span>` : ''}</header>`;
    }

    function renderUserPill() {
      return `<button class="user-pill" onclick="setPhase('profile')"><span class="bounce-avatar bounce-avatar-sm" aria-hidden="true">F</span><span><strong>Fariz</strong><br><small>${state.role}</small></span></button>`;
    }

    function renderTripContextCard(trip) {
      return `<div class="trip-card-context"><strong>${trip.name}</strong><br><span>${trip.city} · ${trip.state}</span></div>`;
    }

    function navButton(label, phase) {
      return `<button class="${state.phase === phase ? 'active' : ''}" onclick="navigate('${phase}')">${label}</button>`;
    }

    function renderGlobalNav() {
      return `<nav class="nav" aria-label="Global navigation">${navButton('Home', 'home')}${navButton('Plan a new trip', 'plan')}${navButton('Join a trip', 'join')}</nav>`;
    }

    function renderTripNav(trip) {
      let items = [];
      if (trip.state === 'planning') items = [['Itinerary', 'planning-itinerary'], ['Flights', 'planning-flights'], ['Suggestions', 'planning-suggestions'], ['FlockMode', 'planning-flock']];
      if (trip.state === 'active') items = [['Today', 'active-today'], ['On the trip', 'active-trip'], ['FlockMode', 'active-flock'], ['Expenses', 'active-expenses'], ['Alerts', 'active-alerts']];
      if (trip.state === 'past') items = [['Wrapped', 'wrap']];
      return `<nav class="nav" aria-label="Trip navigation"><button onclick="setTripContext(null)">← All trips</button>${items.map(([label, phase]) => navButton(label, phase)).join('')}</nav>`;
    }

    function renderShell(content) {
      const trip = tripById(state.tripId);
      return `${renderMobileTopbar()}<div class="mobile-backdrop ${state.isDrawerOpen ? 'show' : ''}" onclick="closeMobileDrawer(); renderApp();"></div><div class="app-shell">
        <aside class="sidebar ${state.isDrawerOpen ? 'open' : ''}">
          <a class="logomark" aria-label="Bounce" href="#" onclick="setTripContext(null); return false;">B<span class="logomark-o">o</span>unce</a>
          ${trip ? renderTripContextCard(trip) + renderTripNav(trip) : renderGlobalNav()}
          ${renderUserPill()}
        </aside>
        <section class="page-body">${content}</section>
      </div><button class="bounce-fab has-alert" aria-label="Chat with Bounce">B</button>${renderJudgePanel()}`;
    }

    function renderHomeScreen() {
      const upcoming = DEMO_TRIPS.filter((trip) => trip.state === 'planning');
      const active = DEMO_TRIPS.filter((trip) => trip.state === 'active');
      const past = DEMO_TRIPS.filter((trip) => trip.state === 'past');
      return renderShell(`<section class="hero"><span class="tag tag-lime">Bounce v5 L1 prototype</span><div class="bounce-avatar bounce-avatar-sm" aria-hidden="true">B</div><h1>Plan trips together, without the chaos.</h1><p>Your trip starts here. Tell me what you've got in mind.</p><button class="btn btn-primary" onclick="setPhase('plan')">Ready to bounce →</button></section>${renderTripSection('Upcoming trips', upcoming)}${renderTripSection('On the road right now', active)}${renderTripSection('Past trips', past)}<section class="card cut-note"><strong>Prototype boundaries</strong><p>Photo sharing coming soon</p><p>Multi-city trips are future scope</p><p>Travel DNA is removed</p></section>`);
    }

    function renderTripSection(title, trips) {
      return `<h2>${title}</h2><div class="trips-grid">${trips.map((trip) => `<article class="card card-elevated"><span class="tag ${trip.state === 'active' ? 'tag-orange' : trip.state === 'past' ? 'tag-purple' : 'tag-lime'}">${trip.state}</span><h3>${trip.name}</h3><p class="muted">${trip.dates} · ${trip.city} · ${trip.travelers} going</p><button class="btn btn-lime" onclick="setTripContext('${trip.id}')">Open trip</button></article>`).join('')}</div>`;
    }

    function renderTripScreen() {
      const trip = tripById(state.tripId) || DEMO_TRIPS[0];
      const wrap = WRAP_DATA[trip.id];
      return renderShell(`<section class="card card-purple"><span class="tag tag-lime">${trip.state}</span><h1>${trip.name}</h1><p>${trip.city} · ${trip.dates}</p><p>Route contract: ${ROUTES.join(' · ')}</p>${trip.state === 'active' ? `<p>Day ${trip.activeDay}/${trip.totalDays}: keep the flock together.</p>` : ''}${wrap ? `<p>Total spent: ${wrap.currency}${wrap.total}. ${wrap.note}</p>` : ''}<button class="btn btn-ghost" onclick="setTripContext(null)">Back to Home</button></section>`);
    }

    function renderJudgePanel() {
      return `<aside class="judge-panel" aria-label="Demo controls"><strong>⚡ Demo controls · drag me</strong><label>Role</label><select onchange="setRole(this.value)"><option value="organiser">Organiser</option><option value="co-leader">Co-leader</option><option value="member">Member</option></select><label>Phase</label><select onchange="setPhase(this.value)"><option value="home">Home</option><option value="planning">Planning</option><option value="active">Active</option><option value="past">Past</option></select></aside>`;
    }

    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = state.tripId ? renderTripScreen() : renderHomeScreen();
    }

    renderApp();
  </script>
</body>
</html>
